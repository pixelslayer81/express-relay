<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening in Adobe Express…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f5f5; color: #333; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 12px; padding: 40px 48px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; max-width: 480px; width: 100%;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e0e0e0; border-top-color: #0078d4;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 13px; color: #666; line-height: 1.5; }
    .error { color: #c50000; font-size: 12px; margin-top: 12px; text-align: left; background: #fff5f5; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .step { font-size: 11px; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Opening template in Adobe Express…</h1>
    <p id="sub">Your Microsoft Social Template is being prepared.</p>
    <p class="step" id="step"></p>
    <pre class="error" id="errMsg" style="display:none"></pre>
  </div>

  <script>
    var CLIENT_ID = 'dce1ddeb0fe8427fa6cb76c9814152d3';
    var APP_NAME  = 'Microsoft Social Templates';

    function setStep(msg) {
      document.getElementById('step').textContent = msg;
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('heading').textContent = 'Could not open Express';
      document.getElementById('sub').textContent = 'Please import the downloaded SVG file manually.';
      document.getElementById('step').textContent = '';
      var el = document.getElementById('errMsg');
      el.textContent = msg;
      el.style.display = '';
    }

    // Convert SVG base64 → JPEG data URI using browser Canvas (capped at 1080px)
    function svgToJpegDataUri(svgBase64) {
      return new Promise(function(resolve, reject) {
        var img = new Image();
        img.onload = function() {
          var w = img.naturalWidth  || 1080;
          var h = img.naturalHeight || 1080;
          var maxDim = 1080;
          if (w > maxDim || h > maxDim) {
            var scale = maxDim / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          var canvas = document.createElement('canvas');
          canvas.width  = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85)); // full data URI
        };
        img.onerror = function() { reject(new Error('Failed to load SVG into Image element')); };
        img.src = 'data:image/svg+xml;base64,' + svgBase64;
      });
    }

    async function openInExpress() {
      setStep('Step 1/3: Checking URL data…');
      var hash = location.hash.slice(1);
      if (!hash) {
        showError('No template data in URL.\n\nThis page must be opened by clicking "Export + Open in Adobe Express" from the Figma plugin — not opened directly.');
        return;
      }
      setStep('Step 2/3: Loading Adobe Express SDK…');

      if (typeof CCEverywhere === 'undefined') {
        showError('CCEverywhere SDK failed to load.\n\nCheck that https://cc-embed.adobe.com is reachable and not blocked by a firewall or proxy.');
        return;
      }

      setStep('Step 2/3: Initializing SDK (Client ID: ' + CLIENT_ID.slice(0,8) + '…)');
      var sdk;
      try {
        sdk = await CCEverywhere.initialize(
          { clientId: CLIENT_ID, appName: APP_NAME },
          { locale: 'en_US' }
        );
      } catch(e) {
        showError('SDK initialization failed:\n' + (e && e.message ? e.message : JSON.stringify(e)) + '\n\nCommon causes:\n• Domain not registered in Adobe Developer Console\n• Business approval not yet granted\n• Network/firewall blocking cc-embed.adobe.com');
        return;
      }

      // Convert SVG → JPEG data URI via Canvas (capped at 1080px, ~100–200KB)
      setStep('Step 3/3: Converting template…');
      var jpegDataUri;
      try {
        jpegDataUri = await svgToJpegDataUri(hash);
      } catch(e) {
        showError('SVG conversion failed:\n' + (e && e.message ? e.message : String(e)));
        return;
      }

      setStep('Step 3/3: Opening Express editor…');

      // Timeout: if Express hasn't opened in 30 seconds, show a helpful message
      var timeout = setTimeout(function() {
        showError('Adobe Express did not open after 30 seconds.\n\nPossible causes:\n• Corporate firewall blocking new.express.adobe.com\n• Try opening https://new.express.adobe.com in a new tab to confirm access\n• Check browser Console (F12) for specific errors');
      }, 30000);

      try {
        if (!sdk.editor || typeof sdk.editor.createWithAsset !== 'function') {
          clearTimeout(timeout);
          showError('sdk.editor.createWithAsset is not a function.\nCheck https://developer.adobe.com/express/embed-sdk/docs/v4/');
          return;
        }
        // dataType:'url' with a data URI — the format Adobe's own examples use
        sdk.editor.createWithAsset(
          { asset: { data: jpegDataUri, dataType: 'url', type: 'image' } },
          {
            callbacks: {
              onCancel:  function() { clearTimeout(timeout); window.close(); },
              onPublish: function(_intent, _params) { clearTimeout(timeout); window.close(); },
              onError:   function(err) {
                clearTimeout(timeout);
                showError('Express editor error:\n' + JSON.stringify(err, null, 2));
              }
            }
          }
        );
      } catch(e) {
        clearTimeout(timeout);
        showError('createWithAsset failed:\n' + (e && e.message ? e.message : JSON.stringify(e)));
      }
    }

    // Load SDK then run
    setStep('Loading SDK script…');
    var script = document.createElement('script');
    script.src = 'https://cc-embed.adobe.com/sdk/v4/CCEverywhere.js';
    script.onload = function() { openInExpress().catch(function(e) { showError('Unexpected error:\n' + (e && e.message ? e.message : String(e))); }); };
    script.onerror = function() { showError('Failed to load https://cc-embed.adobe.com/sdk/v4/CCEverywhere.js\n\nCheck network/firewall settings.'); };
    document.head.appendChild(script);
  </script>
</body>
</html>
