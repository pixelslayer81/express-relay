<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in Adobe Express — Microsoft Social Templates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:  #b5379a;
      --ink:     #0a0a0a;
      --bg:      #fafafa;
      --surface: #ffffff;
      --fg3:     #555558;
      --stroke:  #d4d4d6;
      --font:    'Plus Jakarta Sans', system-ui, sans-serif;
      --radius:  4px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: 100%;
      max-width: 780px;
      padding: 250px 40px 80px;
    }

    /* ── Nav ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 0 24px;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ms-squares {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .ms-squares span { width: 10px; height: 10px; border-radius: 1px; }
    .sq-r { background: #F25022; }
    .sq-g { background: #7FBA00; }
    .sq-b { background: #00A4EF; }
    .sq-y { background: #FFB900; }
    .nav-logo-text {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .nav-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ── Hero ── */
    .hero {
      padding: 4px 0 48px;
    }
    .hero h1 {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 0.93;
      text-transform: uppercase;
      color: var(--ink);
    }

    /* ── Blur state ── */
    .nav, .hero, .section {
      transition: filter 2.4s ease, opacity 2.4s ease;
    }
    .opening .nav,
    .opening .hero,
    .opening .section {
      filter: blur(7px);
      opacity: 0.45;
    }

    /* ── Section label ── */
    .section { margin-bottom: 48px; }
    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg3);
      margin-bottom: 28px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--stroke);
    }
    .section-num {
      color: var(--accent);
      font-weight: 700;
    }

    /* ── Preview row ── */
    .preview-row {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }
    .preview-card {
      width: 260px;
      min-height: 260px;
      background: #d8d8d8;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0,0,0,0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #preview {
      display: none;
      width: 100%;
      height: auto;
      /* no border-radius — parent .preview-card clips it; border-radius on <img> triggers GPU layer promotion which breaks parent filter:blur */
      transition: filter 2.4s ease, opacity 2.4s ease;
    }

    /* ── Template metadata ── */
    .preview-meta {
      flex: 1;
      padding: 6px 0;
    }

    .meta-value {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .meta-sub {
      font-size: 15px;
      font-weight: 400;
      color: var(--fg3);
      line-height: 1.6;
    }

    #step {
      font-size: 12px;
      color: #999;
      margin-top: 10px;
    }

    /* ── Export button ── */
    #openBtn {
      display: none;
      padding: 18px 40px;
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.95);
      color: var(--accent);
      font-family: var(--font);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #openBtn:hover:not(:disabled) { background: var(--accent); color: #fff; }
    #openBtn:active:not(:disabled) { background: var(--accent); color: #fff; }
    #openBtn:disabled { opacity: 0.45; cursor: default; }

    /* ── Error ── */
    #errMsg {
      display: none;
      margin-top: 16px;
      font-size: 12px;
      color: #c00;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-all;
      background: #fff5f5;
      border: 1px solid #ffd0d0;
      border-radius: var(--radius);
      padding: 14px 16px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Nav -->
    <nav class="nav">
      <div class="nav-logo">
        <div class="ms-squares">
          <span class="sq-r"></span><span class="sq-g"></span>
          <span class="sq-b"></span><span class="sq-y"></span>
        </div>
        <span class="nav-logo-text">Microsoft</span>
      </div>
      <div class="nav-badge">Social&nbsp;/&nbsp;Templates</div>
    </nav>

    <!-- Hero -->
    <div class="hero">
      <h1>TEMPLATE<br>READY.</h1>
    </div>

    <!-- 01 Preview -->
    <div class="section">
      <div class="section-label"><span class="section-num">01</span>&nbsp; Preview</div>
      <div class="preview-row">
        <div class="preview-card">
          <div id="spinner"></div>
          <img id="preview" alt="Template preview" />
        </div>
        <div class="preview-meta">
          <p class="meta-value" id="metaType">—</p>
          <p class="meta-sub" id="metaDims">—</p>
          <p class="meta-sub" id="metaCta">—</p>
          <p id="step"></p>
        </div>
      </div>
    </div>

    <!-- 02 Export -->
    <div class="section">
      <div class="section-label"><span class="section-num">02</span>&nbsp; Export</div>
      <button id="openBtn">Open in Adobe Express &nbsp;→</button>
      <pre id="errMsg"></pre>
    </div>

  </div>

  <script>
    var CLIENT_ID = 'ec9582dbc1ec4f089f0cba29bc26c401';
    var APP_NAME  = 'Microsoft Social Templates';

    var svgDataUri = null;
    var svgBase64  = null;   // raw base64, no data URI prefix — for createWithAsset
    var sdk = null;

    // Parse URL params
    var urlParams = new URLSearchParams(location.search);
    var paramType   = urlParams.get('type')   || '';
    var paramFormat = urlParams.get('format') || '';
    var paramMode   = urlParams.get('mode')   || '';
    var paramCta    = urlParams.get('cta')    || '';
    var paramLayout = urlParams.get('layout') || '';

    // "Text Only" → "Text-only layout."  |  "Image + Text" → "Image + text layout."
    var typeDisplay = paramType
      ? paramType.charAt(0).toUpperCase() + paramType.slice(1).toLowerCase() + ' layout.'
      : '—';
    // Format → dimensions
    var dimsMap = { '1:1': '1080 × 1080', '4:5': '1080 × 1350', '16:9': '1920 × 1080' };
    var dims = dimsMap[paramFormat] || paramFormat;
    // Canvas pixel dimensions for createWithAsset inputParams
    var canvasDimsMap = { '1:1': { width: 1080, height: 1080 }, '4:5': { width: 1080, height: 1350 }, '16:9': { width: 1920, height: 1080 } };
    var canvasDims = canvasDimsMap[paramFormat] || { width: 1080, height: 1080 };
    // Sub-layout · dims · mode
    var dimsLine = (paramLayout ? paramLayout + ' · ' : '') + dims + (paramMode ? ' · ' + paramMode + ' mode' : '');
    var ctaLine  = paramCta ? 'CTA button ' + paramCta : '';

    document.getElementById('metaType').textContent = typeDisplay;
    document.getElementById('metaDims').textContent = dimsLine;
    document.getElementById('metaCta').textContent  = ctaLine;

    function setStep(msg) { document.getElementById('step').textContent = msg; }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      var el = document.getElementById('errMsg');
      el.textContent = msg;
      el.style.display = '';
    }

    async function prepare() {
      setStep('Loading template…');

      var raw = location.hash.slice(1);
      var hash;
      try { hash = decodeURIComponent(raw); } catch(e) { hash = raw; }
      if (!hash) {
        showError('No template data in URL.\n\nOpen this page via the Figma plugin "Export & Open in Adobe Express" button.');
        return;
      }

      // Express operates at 300dpi internally. SVG width/height in CSS pixels (96dpi) cause the
      // template to appear at 1080/3375 ≈ 32% of the canvas. Fix: set dimensions in physical inches
      // so Express creates a canvas at the correct physical size and the viewBox fills it.
      var processedBase64 = hash;
      try {
        var svgText = atob(hash);
        var parser  = new DOMParser();
        var svgDoc  = parser.parseFromString(svgText, 'image/svg+xml');
        var svgEl   = svgDoc.documentElement;
        if (svgEl && svgEl.tagName.toLowerCase() === 'svg') {
          var pxW = canvasDims.width;
          var pxH = canvasDims.height;
          // 1 CSS pixel = 1/96 inch
          svgEl.setAttribute('width',  (pxW / 96).toFixed(6) + 'in');
          svgEl.setAttribute('height', (pxH / 96).toFixed(6) + 'in');
          if (!svgEl.getAttribute('viewBox')) {
            svgEl.setAttribute('viewBox', '0 0 ' + pxW + ' ' + pxH);
          }
          var modSvg = new XMLSerializer().serializeToString(svgDoc);
          processedBase64 = btoa(unescape(encodeURIComponent(modSvg)));
        }
      } catch(e) { /* use original hash on parse error */ }

      svgBase64  = processedBase64;
      svgDataUri = 'data:image/svg+xml;base64,' + hash; // preview uses original px dims

      // Render SVG → canvas → PNG for preview (avoids GPU layer that blocks CSS blur)
      var previewEl = document.getElementById('preview');
      var svgImg = new Image();
      svgImg.onload = function() {
        var w = svgImg.naturalWidth  || 1080;
        var h = svgImg.naturalHeight || 1080;
        var scale = Math.min(1, 520 / Math.max(w, h));
        var canvas = document.createElement('canvas');
        canvas.width  = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        canvas.getContext('2d').drawImage(svgImg, 0, 0, canvas.width, canvas.height);
        previewEl.src = canvas.toDataURL('image/png');
        previewEl.style.display = 'block';
        document.getElementById('spinner').style.display = 'none';
      };
      svgImg.onerror = function() {
        previewEl.src = svgDataUri;
        previewEl.style.display = 'block';
        document.getElementById('spinner').style.display = 'none';
      };
      svgImg.src = svgDataUri;

      setStep('Initializing Adobe Express…');
      if (typeof CCEverywhere === 'undefined') {
        showError('CCEverywhere SDK failed to load.\nCheck that https://cc-embed.adobe.com is reachable.');
        return;
      }

      try {
        sdk = await CCEverywhere.initialize(
          { clientId: CLIENT_ID, appName: APP_NAME },
          { locale: 'en_US' }
        );
      } catch(e) {
        showError('SDK init failed:\n' + (e && e.message ? e.message : JSON.stringify(e)));
        return;
      }

      document.getElementById('step').textContent = '';
      document.getElementById('openBtn').style.display = 'block';
    }

    document.getElementById('openBtn').addEventListener('click', function() {
      if (!sdk || !svgBase64) return;
      document.querySelector('.container').classList.add('opening');
      // Also apply blur directly to #preview — belt-and-suspenders in case its compositor layer escapes the parent filter
      var previewEl = document.getElementById('preview');
      previewEl.style.filter  = 'blur(7px)';
      previewEl.style.opacity = '0.45';
      var btn = document.getElementById('openBtn');
      btn.disabled = true;
      btn.textContent = 'Opening…';

      function resetBlur() {
        document.querySelector('.container').classList.remove('opening');
        previewEl.style.filter  = '';
        previewEl.style.opacity = '';
      }

      var assetConfig = { type: 'image', dataType: 'base64', data: svgBase64 };
      var callbacks = {
        onCancel:  function() { btn.disabled = false; btn.textContent = 'Open in Adobe Express  →'; resetBlur(); },
        onPublish: function(_intent, publishParams) {
          if (publishParams && publishParams.asset && publishParams.asset[0]) {
            var a = document.createElement('a');
            a.href = publishParams.asset[0].data;
            a.download = 'template-express.jpg';
            a.click();
          }
          window.close();
        },
        onError: function(err) {
          btn.disabled = false;
          btn.textContent = 'Open in Adobe Express  →';
          resetBlur();
          showError('Express error:\n' + JSON.stringify(err, null, 2));
        }
      };
      var exportConfig = [{ id: 'download', label: 'Download', action: { target: 'download' }, style: { uiType: 'button' } }];

      sdk.editor.createWithAsset(
        { asset: assetConfig },
        { callbacks: callbacks },
        exportConfig
      );
    });

    var script = document.createElement('script');
    script.src = 'https://cc-embed.adobe.com/sdk/v4/CCEverywhere.js';
    script.onload = function() {
      prepare().catch(function(e) {
        showError('Unexpected error:\n' + e.message);
      });
    };
    script.onerror = function() {
      showError('Failed to load CCEverywhere SDK.\nCheck network/firewall.');
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
