<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening in Adobe Express…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f5f5; color: #333; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 12px; padding: 40px 48px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; max-width: 520px; width: 100%;
    }
    .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #0078d4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 13px; color: #666; line-height: 1.5; }
    .error { color: #c50000; font-size: 12px; margin-top: 12px; text-align: left; background: #fff5f5; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .step { font-size: 11px; color: #999; margin-top: 8px; }
    #preview { display: none; margin: 12px auto 0; max-width: 200px; border-radius: 6px; border: 1px solid #e0e0e0; }
    #debugInfo { font-size: 10px; color: #aaa; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Opening template in Adobe Express…</h1>
    <p id="sub">Your Microsoft Social Template is being prepared.</p>
    <p class="step" id="step"></p>
    <img id="preview" alt="Template preview" />
    <p id="debugInfo"></p>
    <pre class="error" id="errMsg" style="display:none"></pre>
  </div>

  <script>
    var CLIENT_ID = 'dce1ddeb0fe8427fa6cb76c9814152d3';
    var APP_NAME  = 'Microsoft Social Templates';

    function setStep(msg) { document.getElementById('step').textContent = msg; }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('heading').textContent = 'Could not open Express';
      document.getElementById('sub').textContent = 'Please import the downloaded SVG file manually.';
      document.getElementById('step').textContent = '';
      var el = document.getElementById('errMsg');
      el.textContent = msg;
      el.style.display = '';
    }

    // SVG base64 → JPEG data URI via canvas + FileReader (matches Adobe's official example exactly)
    function svgToJpegDataUri(svgBase64) {
      return new Promise(function(resolve, reject) {
        var img = new Image();
        img.onload = function() {
          var w = img.naturalWidth  || 1080;
          var h = img.naturalHeight || 1080;
          var maxDim = 1080;
          if (w > maxDim || h > maxDim) {
            var scale = maxDim / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(function(blob) {
            if (!blob) { reject(new Error('canvas.toBlob returned null')); return; }
            var reader = new FileReader();
            reader.onloadend = function() { resolve(reader.result); }; // full data URI
            reader.onerror = function() { reject(new Error('FileReader error')); };
            reader.readAsDataURL(blob);
          }, 'image/jpeg', 0.85);
        };
        img.onerror = function() { reject(new Error('Failed to load SVG into Image element')); };
        img.src = 'data:image/svg+xml;base64,' + svgBase64;
      });
    }

    async function openInExpress() {
      setStep('Step 1/3: Checking URL data…');

      // decodeURIComponent handles any %2B/%2F encoding added by Figma/OS when opening the URL
      var raw = location.hash.slice(1);
      var hash;
      try { hash = decodeURIComponent(raw); } catch(e) { hash = raw; }

      if (!hash) {
        showError('No template data in URL.\n\nOpen this page via the Figma plugin "Export + Open in Adobe Express" button.');
        return;
      }

      setStep('Step 2/3: Converting template to image…');
      var jpegDataUri;
      try {
        jpegDataUri = await svgToJpegDataUri(hash);
      } catch(e) {
        showError('SVG conversion failed:\n' + (e && e.message ? e.message : String(e)));
        return;
      }

      // Show preview to confirm conversion worked
      var previewEl = document.getElementById('preview');
      previewEl.src = jpegDataUri;
      previewEl.style.display = 'block';
      var sizeKb = Math.round(jpegDataUri.length * 0.75 / 1024);
      document.getElementById('debugInfo').textContent = 'Preview: ' + sizeKb + ' KB JPEG';

      setStep('Step 3/3: Loading Adobe Express SDK…');
      if (typeof CCEverywhere === 'undefined') {
        showError('CCEverywhere SDK failed to load.\nCheck that https://cc-embed.adobe.com is reachable.');
        return;
      }

      setStep('Step 3/3: Initializing SDK…');
      var sdk;
      try {
        sdk = await CCEverywhere.initialize(
          { clientId: CLIENT_ID, appName: APP_NAME },
          { locale: 'en_US' }
        );
      } catch(e) {
        showError('SDK init failed:\n' + (e && e.message ? e.message : JSON.stringify(e)));
        return;
      }

      setStep('Step 3/3: Opening Express editor…');
      var timeout = setTimeout(function() {
        showError('Adobe Express did not open after 90 seconds.\nCheck browser Console (F12) for details.');
      }, 90000);

      try {
        if (!sdk.editor || typeof sdk.editor.createWithAsset !== 'function') {
          clearTimeout(timeout);
          showError('sdk.editor.createWithAsset not available.');
          return;
        }
        // Convert data URI → Blob, pass as dataType:'blob' (opens Express modal)
        var byteStr = atob(jpegDataUri.split(',')[1]);
        var arr = new Uint8Array(byteStr.length);
        for (var i = 0; i < byteStr.length; i++) arr[i] = byteStr.charCodeAt(i);
        var jpegBlob = new Blob([arr], { type: 'image/jpeg' });

        sdk.editor.createWithAsset(
          { asset: { type: 'image', dataType: 'blob', data: jpegBlob, name: 'template.jpg' } },
          {
            callbacks: {
              onCancel:  function() { clearTimeout(timeout); window.close(); },
              onPublish: function() { clearTimeout(timeout); window.close(); },
              onError:   function(err) {
                clearTimeout(timeout);
                showError('Express error:\n' + JSON.stringify(err, null, 2));
              }
            }
          }
        );
      } catch(e) {
        clearTimeout(timeout);
        showError('createWithAsset threw:\n' + (e && e.message ? e.message : JSON.stringify(e)));
      }
    }

    setStep('Loading SDK…');
    var script = document.createElement('script');
    script.src = 'https://cc-embed.adobe.com/sdk/v4/CCEverywhere.js';
    script.onload = function() {
      openInExpress().catch(function(e) {
        showError('Unexpected error:\n' + (e && e.message ? e.message : String(e)));
      });
    };
    script.onerror = function() {
      showError('Failed to load CCEverywhere SDK.\nCheck network/firewall.');
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
