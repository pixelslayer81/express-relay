<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in Adobe Express</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f5f5; color: #333; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 12px; padding: 40px 48px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; max-width: 520px; width: 100%;
    }
    .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #0078d4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 13px; color: #666; line-height: 1.5; }
    .step { font-size: 11px; color: #999; margin-top: 8px; }
    #preview { display: none; margin: 16px auto 0; max-width: 220px; border-radius: 8px; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    #openBtn {
      display: none; margin: 20px auto 0;
      background: #e31c79; color: #fff; border: none; border-radius: 8px;
      padding: 12px 28px; font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: background 0.15s;
    }
    #openBtn:hover { background: #c41569; }
    #openBtn:disabled { background: #ccc; cursor: default; }
    .error { color: #c50000; font-size: 12px; margin-top: 12px; text-align: left; background: #fff5f5; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    #errMsg { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Preparing your template…</h1>
    <p id="sub">Converting for Adobe Express.</p>
    <p class="step" id="step"></p>
    <img id="preview" alt="Template preview" />
    <button id="openBtn">Open in Adobe Express</button>
    <pre class="error" id="errMsg"></pre>
  </div>

  <script>
    var CLIENT_ID = 'dce1ddeb0fe8427fa6cb76c9814152d3';
    var APP_NAME  = 'Microsoft Social Templates';

    var jpegDataUri = null;
    var sdk = null;

    function setStep(msg) { document.getElementById('step').textContent = msg; }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('openBtn').style.display = 'none';
      document.getElementById('heading').textContent = 'Could not open Express';
      document.getElementById('sub').textContent = 'Please import the downloaded SVG file manually.';
      document.getElementById('step').textContent = '';
      var el = document.getElementById('errMsg');
      el.textContent = msg;
      el.style.display = '';
    }

    function svgToJpegDataUri(svgBase64) {
      return new Promise(function(resolve, reject) {
        var img = new Image();
        img.onload = function() {
          var w = img.naturalWidth  || 1080;
          var h = img.naturalHeight || 1080;
          var maxDim = 1080;
          if (w > maxDim || h > maxDim) {
            var scale = maxDim / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.92));
        };
        img.onerror = function() { reject(new Error('Failed to load SVG')); };
        img.src = 'data:image/svg+xml;base64,' + svgBase64;
      });
    }

    // Prepare: convert SVG + init SDK in background (no user gesture needed yet)
    async function prepare() {
      setStep('Converting template…');

      var raw = location.hash.slice(1);
      var hash;
      try { hash = decodeURIComponent(raw); } catch(e) { hash = raw; }
      if (!hash) {
        showError('No template data in URL.\n\nOpen this page via the Figma plugin "Export + Open in Adobe Express" button.');
        return;
      }

      try {
        jpegDataUri = await svgToJpegDataUri(hash);
      } catch(e) {
        showError('SVG conversion failed:\n' + e.message);
        return;
      }

      // Show preview
      var previewEl = document.getElementById('preview');
      previewEl.src = jpegDataUri;
      previewEl.style.display = 'block';

      setStep('Initializing Adobe Express…');
      if (typeof CCEverywhere === 'undefined') {
        showError('CCEverywhere SDK failed to load.\nCheck that https://cc-embed.adobe.com is reachable.');
        return;
      }

      try {
        sdk = await CCEverywhere.initialize(
          { clientId: CLIENT_ID, appName: APP_NAME },
          { locale: 'en_US' }
        );
      } catch(e) {
        showError('SDK init failed:\n' + (e && e.message ? e.message : JSON.stringify(e)));
        return;
      }

      // Ready — show button, hide spinner
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('heading').textContent = 'Template ready';
      document.getElementById('sub').textContent = 'Click below to open and edit in Adobe Express.';
      document.getElementById('step').textContent = '';
      document.getElementById('openBtn').style.display = 'block';
    }

    // Open Express — called directly from user click (satisfies user-gesture requirement)
    document.getElementById('openBtn').addEventListener('click', function() {
      if (!sdk || !jpegDataUri) return;
      var btn = document.getElementById('openBtn');
      btn.disabled = true;
      btn.textContent = 'Opening…';

      var assetConfig = { type: 'image', dataType: 'base64', data: jpegDataUri };
      var callbacks = {
        onCancel:  function() { btn.disabled = false; btn.textContent = 'Open in Adobe Express'; },
        onPublish: function(_intent, publishParams) {
          if (publishParams && publishParams.asset && publishParams.asset[0]) {
            var a = document.createElement('a');
            a.href = publishParams.asset[0].data;
            a.download = 'template-express.jpg';
            a.click();
          }
          window.close();
        },
        onError: function(err) {
          btn.disabled = false;
          btn.textContent = 'Open in Adobe Express';
          showError('Express error:\n' + JSON.stringify(err, null, 2));
        }
      };
      var exportConfig = [
        {
          id: 'download',
          label: 'Download',
          action: { target: 'download' },
          style: { uiType: 'button' }
        }
      ];

      sdk.editor.createWithAsset(
        { asset: assetConfig },
        { callbacks: callbacks },
        exportConfig
      );
    });

    // Load SDK then prepare
    var script = document.createElement('script');
    script.src = 'https://cc-embed.adobe.com/sdk/v4/CCEverywhere.js';
    script.onload = function() {
      prepare().catch(function(e) {
        showError('Unexpected error:\n' + e.message);
      });
    };
    script.onerror = function() {
      showError('Failed to load CCEverywhere SDK.\nCheck network/firewall.');
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
